[workspace]
resolver = "3"
members = ["crates/pdfcore", "crates/app"]

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.90"

# Профиль отладки: сам наш код без оптимизаций (быстрая пересборка),
# но зависимости — с opt-level 2, иначе рендер и шейпинг текста
# в debug-сборке неюзабельно медленные.
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
# Раскрутка стека, а не abort: правка идёт в отдельном потоке, и паника в нём
# при `abort` уносила всё приложение — без окна с консолью пользователь видел
# лишь молча исчезнувшую программу. С раскруткой поток умирает один, а
# приложение успевает сказать, что случилось.
panic = "unwind"
